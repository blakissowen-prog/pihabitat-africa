<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiHabitat Africa - Test</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>Pi.init({version:"2.0", sandbox:true})</script>
</head>
<body style="font-family:sans-serif;text-align:center;padding:40px;background:#f8f7ff">
<h1>PiHabitat Africa</h1>
<p>Test paiement Testnet avant Ecosystem Listing</p>
<button id="btn" style="padding:20px 40px;background:#6d28d9;color:#fff;border:0;border-radius:12px;font-size:18px;font-weight:bold">Payer 1 Test-Pi</button>
<p id="msg" style="margin-top:20px;font-weight:bold"></p>
<script>
document.getElementById('btn').onclick = async () => {
  const m = document.getElementById('msg');
  try {
    m.innerText = "Connexion Pi...";
    await Pi.authenticate(['payments','username'], () => {});
    m.innerText = "Paiement en cours...";
    await Pi.createPayment({
      amount: 1,
      memo: "Test PiHabitat Africa",
      metadata: { type: "test-habitat" }
    }, {
      onReadyForServerApproval: async (id) => {
        m.innerText = "Approbation serveur...";
        await fetch('/.netlify/functions/approve', {
          method: 'POST',
          body: JSON.stringify({paymentId: id})
        });
      },
      onReadyForServerCompletion: async (id, txid) => {
        m.innerText = "Finalisation...";
        await fetch('/.netlify/functions/complete', {
          method: 'POST',
          body: JSON.stringify({paymentId: id, txid})
        });
        m.innerText = "REUSSI ! Tx: " + txid;
      },
      onCancel: () => m.innerText = "Annule",
      onError: (e) => m.innerText = "Erreur: " + e.message
    });
  } catch (e) {
    m.innerText = "Erreur: " + e.message;
  }
}
</script>
</body>
</html>
